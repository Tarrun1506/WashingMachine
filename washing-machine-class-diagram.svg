<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Washing Machine Project Class Diagram</title>
  <desc id="desc">UML-style class diagram of the current WashingMachine project, showing console controller and views, services, repositories, JSON storage, domain models, wash program inheritance, and key dependencies.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65758c"/></marker>
    <marker id="triangle" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1L13 7L1 13Z" fill="#fff" stroke="#65758c" stroke-width="1.5"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#1c2940}.title{font-size:32px;font-weight:700}.sub{font-size:15px;fill:#607087}.pkg{font-size:18px;font-weight:700;fill:#34445d}.class{font-size:16px;font-weight:700}.stereo{font-size:11px;font-weight:600;fill:#687991}.body{font-size:12px;fill:#43536a}.small{font-size:12px;fill:#596a81}.line{fill:none;stroke:#65758c;stroke-width:2;marker-end:url(#arrow)}.inherit{fill:none;stroke:#65758c;stroke-width:2;marker-end:url(#triangle)}.dash{stroke-dasharray:7 5}.card{fill:#fff;stroke:#aebbd0;stroke-width:1.6}.iface{fill:#f4f8ff;stroke:#6092c8;stroke-width:1.8}.pkgbox{fill:#f8fafd;stroke:#d4dce8;stroke-width:1.4}.tag{fill:#eaf1fb;stroke:#cfdaeb;stroke-width:1}
    </style>
  </defs>
  <rect width="1800" height="1320" fill="#f3f6fb"/>
  <rect x="34" y="30" width="1732" height="1260" rx="24" fill="#fff" stroke="#d9e1ec" stroke-width="2"/>
  <text x="72" y="84" class="title">Washing Machine — Class Diagram</text>
  <text x="72" y="112" class="sub">Current simple-console branch • main classes, contracts, and dependencies</text>

  <!-- Packages -->
  <rect x="60" y="150" width="500" height="545" rx="16" class="pkgbox"/><text x="82" y="181" class="pkg">Application &amp; Presentation</text>
  <rect x="585" y="150" width="575" height="545" rx="16" class="pkgbox"/><text x="607" y="181" class="pkg">Services</text>
  <rect x="1185" y="150" width="555" height="545" rx="16" class="pkgbox"/><text x="1207" y="181" class="pkg">Repositories &amp; Storage</text>
  <rect x="60" y="725" width="1110" height="500" rx="16" class="pkgbox"/><text x="82" y="756" class="pkg">Domain Models &amp; Wash Programs</text>
  <rect x="1185" y="725" width="555" height="500" rx="16" class="pkgbox"/><text x="1207" y="756" class="pkg">Shared Types &amp; Helpers</text>

  <!-- App/controller and views -->
  <rect x="86" y="207" width="205" height="98" rx="10" class="card"/>
  <text x="188" y="230" text-anchor="middle" class="stereo">&lt;&lt;entry point&gt;&gt;</text><text x="188" y="253" text-anchor="middle" class="class">Program</text>
  <text x="102" y="276" class="body">Main() • builds dependencies</text><text x="102" y="293" class="body">starts controller</text>

  <rect x="320" y="207" width="210" height="98" rx="10" class="iface"/>
  <text x="425" y="230" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text><text x="425" y="253" text-anchor="middle" class="class">IWashingMachineController</text>
  <text x="336" y="281" class="body">Start()</text>

  <rect x="86" y="330" width="444" height="118" rx="10" class="card"/>
  <text x="308" y="356" text-anchor="middle" class="class">WashingMachineController</text>
  <text x="104" y="380" class="body">Start • handles menus and application flow</text><text x="104" y="399" class="body">Coordinates machine, favourites, history, state persistence</text><text x="104" y="424" class="body">Subscribes to cycle progress / completion / cancellation events</text>

  <rect x="86" y="475" width="444" height="190" rx="10" class="card"/>
  <text x="308" y="501" text-anchor="middle" class="stereo">&lt;&lt;views&gt;&gt;</text>
  <text x="108" y="529" class="class">ConsoleMenuView</text><text x="108" y="550" class="body">Show(machine) • messages • clothes input</text>
  <line x1="108" y1="565" x2="508" y2="565" stroke="#e0e6ef"/>
  <text x="108" y="589" class="class">ConfigurationView</text><text x="108" y="607" class="class">PauseView</text><text x="108" y="625" class="class">FavouriteView</text><text x="108" y="643" class="class">HistoryView</text>

  <!-- Services -->
  <rect x="610" y="207" width="245" height="94" rx="10" class="iface"/>
  <text x="732" y="230" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text><text x="732" y="254" text-anchor="middle" class="class">IWashingMachineService</text><text x="626" y="280" class="body">cycle • clothes • settings • recovery</text>
  <rect x="880" y="207" width="245" height="94" rx="10" class="card"/>
  <text x="1002" y="239" text-anchor="middle" class="class">WashingMachineService</text><text x="896" y="264" class="body">Owns machine state and cycle task</text><text x="896" y="283" class="body">Raises progress / terminal events</text>

  <rect x="610" y="347" width="245" height="84" rx="10" class="iface"/>
  <text x="732" y="370" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text><text x="732" y="394" text-anchor="middle" class="class">IFavouriteService</text><text x="626" y="417" class="body">list • add • apply • delete</text>
  <rect x="880" y="347" width="245" height="84" rx="10" class="card"/>
  <text x="1002" y="382" text-anchor="middle" class="class">FavouriteService</text><text x="896" y="408" class="body">validates favourites and settings</text>

  <rect x="610" y="477" width="245" height="84" rx="10" class="iface"/>
  <text x="732" y="500" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text><text x="732" y="524" text-anchor="middle" class="class">IWashHistoryService</text><text x="626" y="547" class="body">list • add • load • save</text>
  <rect x="880" y="477" width="245" height="84" rx="10" class="card"/>
  <text x="1002" y="512" text-anchor="middle" class="class">WashHistoryService</text><text x="896" y="538" class="body">history operations</text>

  <rect x="610" y="598" width="515" height="62" rx="10" class="card"/>
  <text x="630" y="624" class="class">Logger</text><text x="630" y="646" class="body">Used by controller and machine service</text>

  <!-- Persistence -->
  <rect x="1210" y="207" width="235" height="78" rx="10" class="iface"/>
  <text x="1327" y="229" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text><text x="1327" y="252" text-anchor="middle" class="class">IMachineStateRepository</text><text x="1227" y="273" class="body">Load() • Save(machine)</text>
  <rect x="1470" y="207" width="235" height="78" rx="10" class="card"/>
  <text x="1587" y="240" text-anchor="middle" class="class">MachineStateRepository</text><text x="1487" y="269" class="body">single machine snapshot</text>

  <rect x="1210" y="324" width="235" height="78" rx="10" class="iface"/>
  <text x="1327" y="346" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text><text x="1327" y="369" text-anchor="middle" class="class">IFavouriteRepository</text><text x="1227" y="390" class="body">CRUD favourites</text>
  <rect x="1470" y="324" width="235" height="78" rx="10" class="card"/>
  <text x="1587" y="357" text-anchor="middle" class="class">FavouriteRepository</text><text x="1487" y="386" class="body">in-memory list + JSON save</text>

  <rect x="1210" y="441" width="235" height="78" rx="10" class="iface"/>
  <text x="1327" y="463" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text><text x="1327" y="486" text-anchor="middle" class="class">IWashHistoryRepository</text><text x="1227" y="507" class="body">list • add • load • save</text>
  <rect x="1470" y="441" width="235" height="78" rx="10" class="card"/>
  <text x="1587" y="474" text-anchor="middle" class="class">WashHistoryRepository</text><text x="1487" y="503" class="body">in-memory list + JSON save</text>

  <rect x="1210" y="563" width="235" height="78" rx="10" class="iface"/>
  <text x="1327" y="585" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text><text x="1327" y="608" text-anchor="middle" class="class">IStorage</text><text x="1227" y="629" class="body">load/save JSON data</text>
  <rect x="1470" y="563" width="235" height="78" rx="10" class="card"/>
  <text x="1587" y="596" text-anchor="middle" class="class">JsonStorage</text><text x="1487" y="625" class="body">atomic file replacement</text>

  <!-- Domain models -->
  <rect x="86" y="790" width="280" height="145" rx="10" class="card"/>
  <text x="226" y="818" text-anchor="middle" class="class">WashingMachineModel</text>
  <text x="104" y="843" class="body">State : MachineState</text><text x="104" y="862" class="body">ClothesCount • IsDoorLocked</text><text x="104" y="881" class="body">Settings : WashSettings</text><text x="104" y="900" class="body">CurrentCycle : WashCycle?</text><text x="104" y="920" class="body">Capacity = 10</text>

  <rect x="397" y="790" width="250" height="114" rx="10" class="card"/>
  <text x="522" y="819" text-anchor="middle" class="class">WashSettings</text>
  <text x="415" y="845" class="body">ProgramName • Temperature</text><text x="415" y="864" class="body">SpinSpeed • WaterLevel</text><text x="415" y="883" class="body">PreWash • ExtraRinse • QuickWash</text>

  <rect x="680" y="790" width="220" height="114" rx="10" class="card"/>
  <text x="790" y="819" text-anchor="middle" class="class">WashCycle</text>
  <text x="698" y="845" class="body">StartTime • Stage</text><text x="698" y="864" class="body">ProgressPercentage</text><text x="698" y="883" class="body">RemainingSeconds</text>

  <rect x="933" y="790" width="205" height="114" rx="10" class="card"/>
  <text x="1035" y="819" text-anchor="middle" class="class">Favourite</text>
  <text x="951" y="845" class="body">Name • ProgramName</text><text x="951" y="864" class="body">Saved wash settings</text><text x="951" y="883" class="body">Id : Guid</text>

  <rect x="86" y="968" width="280" height="114" rx="10" class="card"/>
  <text x="226" y="997" text-anchor="middle" class="class">WashHistory</text>
  <text x="104" y="1023" class="body">ProgramName • ClothesCount</text><text x="104" y="1042" class="body">StartTime • EndTime • Status</text><text x="104" y="1061" class="body">Duration</text>

  <rect x="397" y="955" width="420" height="82" rx="10" class="card"/>
  <text x="607" y="981" text-anchor="middle" class="stereo">&lt;&lt;abstract&gt;&gt;</text><text x="607" y="1005" text-anchor="middle" class="class">WashProgram</text><text x="415" y="1027" class="body">Name • Description • GetDuration()</text>
  <rect x="397" y="1060" width="420" height="120" rx="10" class="card"/>
  <text x="607" y="1084" text-anchor="middle" class="small">Concrete programs</text>
  <text x="415" y="1110" class="body">CottonProgram • QuickWashProgram</text><text x="415" y="1132" class="body">SyntheticProgram • WoolProgram</text><text x="415" y="1154" class="body">HeavyWashProgram</text>

  <rect x="850" y="955" width="288" height="160" rx="10" class="iface"/>
  <text x="994" y="980" text-anchor="middle" class="stereo">&lt;&lt;event args&gt;&gt;</text><text x="994" y="1004" text-anchor="middle" class="class">WashProgressEventArgs</text>
  <text x="868" y="1032" class="body">Stage : CycleStage</text><text x="868" y="1052" class="body">ProgressPercentage : double</text><text x="868" y="1072" class="body">RemainingSeconds : int</text><text x="868" y="1098" class="small">Raised by service progress event</text>

  <!-- Shared -->
  <rect x="1210" y="790" width="500" height="175" rx="10" class="card"/>
  <text x="1460" y="818" text-anchor="middle" class="class">Enums</text>
  <text x="1230" y="847" class="body">MachineState: Idle, Ready, Running, Paused</text><text x="1230" y="870" class="body">CycleStage • CycleStatus • Temperature</text><text x="1230" y="893" class="body">WaterLevel • SpinSpeed • MenuOption</text><text x="1230" y="916" class="body">FavouriteMenuOption • PauseMenuOption</text><text x="1230" y="939" class="body">Used by services, views, and domain models</text>

  <rect x="1210" y="995" width="500" height="96" rx="10" class="card"/>
  <text x="1460" y="1023" text-anchor="middle" class="class">SettingsValidator</text><text x="1230" y="1050" class="body">Validates and normalizes settings and favourite names</text><text x="1230" y="1073" class="body">Used by ConfigurationView and FavouriteService</text>

  <rect x="1210" y="1115" width="500" height="76" rx="10" class="tag"/>
  <text x="1230" y="1143" class="class">MachineOperationException • StorageException</text><text x="1230" y="1168" class="body">Domain and persistence error types</text>

  <!-- Relationships: realization/inheritance and associations -->
  <path d="M291 256 H310 V330 H320" class="line"/>
  <path d="M425 330 V305" class="inherit"/>
  <path d="M880 254 H855" class="inherit"/>
  <path d="M880 390 H855" class="inherit"/>
  <path d="M880 520 H855" class="inherit"/>
  <path d="M1470 246 H1445" class="inherit"/>
  <path d="M1470 363 H1445" class="inherit"/>
  <path d="M1470 480 H1445" class="inherit"/>
  <path d="M1470 602 H1445" class="inherit"/>

  <!-- controller dependencies to services / repositories -->
  <path d="M530 368 H572 V254 H601" class="line dash"/>
  <path d="M530 385 H575 V389 H601" class="line dash"/>
  <path d="M530 402 H575 V519 H601" class="line dash"/>
  <path d="M530 420 H565 V710 H1170 V246 H1201" class="line dash"/>
  <!-- service dependencies -->
  <path d="M1002 301 V323 H1150 V480 H1201" class="line dash"/>
  <path d="M1002 431 V442 H1180 V363 H1201" class="line dash"/>
  <path d="M1002 561 V575 H1196 V480" class="line dash"/>
  <!-- repositories use storage -->
  <path d="M1587 285 V550 H1448 V602" class="line dash"/>
  <path d="M1587 402 V550 H1448 V602" class="line dash"/>
  <path d="M1587 519 V550 H1448 V602" class="line dash"/>
  <!-- service/model and settings relationships -->
  <path d="M880 285 H1168 V750 H226 V782" class="line dash"/>
  <path d="M366 860 H389" class="line"/>
  <path d="M366 885 H670 V860" class="line"/>
  <path d="M522 904 V940 H522 V950" class="line"/>
  <path d="M522 1060 V1047" class="inherit"/>
  <path d="M366 1025 H385" class="line"/>
  <!-- note for links into model / event boxes -->
  <path d="M1125 254 H1150 V1120 H1138" class="line dash"/>
  <path d="M855 267 H870 V920 H994 V947" class="line dash"/>
  <path d="M308 448 V475" class="line dash"/>

  <!-- Legend -->
  <line x1="85" y1="1200" x2="145" y2="1200" class="line"/><text x="158" y="1205" class="small">uses / depends on</text>
  <line x1="310" y1="1200" x2="370" y2="1200" class="inherit"/><text x="383" y="1205" class="small">implements / inherits</text>
  <line x1="590" y1="1200" x2="650" y2="1200" class="line dash"/><text x="663" y="1205" class="small">dependency / event flow</text>
  <text x="1710" y="1244" text-anchor="end" class="small">Generated from current project source</text>
</svg>
